[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortechx-meeting-summarizer-backend"
version = "0.1.0"
description = "API para transcrição e sumarização de reuniões."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "langchain",
    "notion-client",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "alembic",
    "asyncpg",
    "psycopg[binary]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
